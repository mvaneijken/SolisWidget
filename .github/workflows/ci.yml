name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit tests (Run No Evil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests in the Connect IQ simulator
        run: >
          docker run --rm -v "$PWD":/work -w /work --entrypoint bash
          ghcr.io/matco/connectiq-tester:latest
          .github/scripts/run-tests.sh fenix7

  build:
    name: Build store package (.iq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signing key
        env:
          CONNECTIQ_DEVELOPER_KEY: ${{ secrets.CONNECTIQ_DEVELOPER_KEY }}
        run: |
          if [ -n "$CONNECTIQ_DEVELOPER_KEY" ]; then
            echo "$CONNECTIQ_DEVELOPER_KEY" | base64 -d > developer_key.der
            echo "Using developer key from the CONNECTIQ_DEVELOPER_KEY secret."
          else
            openssl genrsa -out key.pem 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt
            echo "::warning::CONNECTIQ_DEVELOPER_KEY secret is not set — the package is signed with a throwaway key and can NOT be uploaded to the Connect IQ store."
          fi

      - name: Build .iq for all supported devices
        run: >
          docker run --rm -v "$PWD":/work -w /work --entrypoint bash
          ghcr.io/matco/connectiq-tester:latest
          .github/scripts/build-iq.sh developer_key.der bin/SolisWidget.iq

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolisWidget-iq
          path: bin/SolisWidget.iq
