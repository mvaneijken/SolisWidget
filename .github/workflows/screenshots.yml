name: Screenshots

# Captures Connect IQ store screenshots in the simulator, using the demo
# build (hardcoded realistic values, no network). One image per widget page
# per device. The results are committed to docs/screenshots on the branch
# and also uploaded as artifacts.
#
# NOTE: the Connect IQ simulator is unstable under Xvfb on GitHub-hosted
# runners (it segfaults shortly after an app launch — observed with SDKs
# 8.4.0 through 9.2.0), so this workflow is manual-only and may fail.
# The reliable path is capturing locally with the demo build; see the
# "Store screenshots" section in the README.
on:
  workflow_dispatch:

jobs:
  screenshot:
    name: Screenshot ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [fr970, fr965, fenix847mm, venu3]
    steps:
      - uses: actions/checkout@v4

      # v2.7.0 bundles SDK 8.4.0 with matching device files: recent enough
      # for current devices, and its simulator does not have the 9.x
      # crash-under-Xvfb bug
      - name: Capture simulator screenshots
        run: >
          docker run --rm -v "$PWD":/work -w /work --entrypoint bash
          ghcr.io/matco/connectiq-tester:v2.7.0
          .github/scripts/screenshot.sh ${{ matrix.device }} screenshots

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.device }}
          path: screenshots/*.png

  commit:
    name: Commit screenshots to the branch
    needs: screenshot
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v5
        with:
          pattern: screenshot-*
          merge-multiple: true
          path: docs/screenshots

      - name: Commit and push screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "Update simulator screenshots [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
